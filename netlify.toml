# Netlify : projet « flemmeorg » (https://flemme.org), production = branche prod.
# Publie le site apps/web. « publish » et « command » sont relatifs à « base ».
[build]
  base = "apps/web"
  command = "npm run build"
  publish = "dist"
  # Ne reconstruit que si le site ou les règles partagées de l'app mobile ont changé.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../mobile/src ../../netlify.toml"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Page admin : jamais indexée, jamais mise en cache, jamais affichée dans un cadre.
[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"

# Fonctions Netlify (relatif à « base ») : /api/alerte reçoit les alertes envoyées par Supabase.
[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Anciennes adresses du site historique (dépôt FlemmeV2.0) : on renvoie vers
# le nouvel équivalent plutôt qu'une 404. 302 tant que la refonte n'est pas figée.
[[redirects]]
  from = "/espace*"
  to = "/app.html#mine"
  status = 302

[[redirects]]
  from = "/manager*"
  to = "/app.html#mine"
  status = 302

[[redirects]]
  from = "/rejoindre*"
  to = "/app.html#find"
  status = 302

[[redirects]]
  from = "/gestionadmin*"
  to = "/admin"
  status = 302

[[redirects]]
  from = "/services*"
  to = "/"
  status = 302

[[redirects]]
  from = "/demarche*"
  to = "/"
  status = 302

[[redirects]]
  from = "/ambassadeurs*"
  to = "/"
  status = 302

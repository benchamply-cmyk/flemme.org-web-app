# Netlify : projet « flemmeorg » (https://flemme.org), production = branche prod.
# Publie le site apps/web. « publish » et « command » sont relatifs à « base ».
[build]
  base = "apps/web"
  command = "npm run build"
  publish = "dist"
  # Ne reconstruit que si le site ou le code partagé avec l'app mobile (packages/shared) ont changé.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../../packages/shared ../../beta ../../netlify.toml"

[build.environment]
  NODE_VERSION = "22"
  # Mode réel : VITE_SUPABASE_URL et VITE_SUPABASE_PUBLISHABLE_KEY se règlent dans l'interface Netlify
  # (Environment variables, par contexte de déploiement), pas ici. Sans elles : démo locale.
  # Voir docs/supabase-mise-en-service.md.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Page admin : jamais indexée, jamais mise en cache, jamais affichée dans un cadre.
[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"

# Fonctions Netlify (relatif à « base ») : /api/alerte reçoit les alertes envoyées par Supabase.
[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Vitrine sans « .html » (plan d'adresses, PR 2) : chaque page est servie à son adresse courte
# (/faq sert faq.html, comportement par défaut de Netlify), et l'ancienne adresse y renvoie en 301.
# « force » : le fichier .html existe, la règle doit passer avant lui.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true


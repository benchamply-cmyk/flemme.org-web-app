# Netlify : projet « flemme-web-app » (https://flemme-web-app.netlify.app).
# Publie le site apps/web. « publish » et « command » sont relatifs à « base ».
[build]
  base = "apps/web"
  command = "npm run build"
  publish = "dist"
  # Ne reconstruit que si le site ou les règles partagées de l'app mobile ont changé.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../mobile/src ../../netlify.toml"

[build.environment]
  NODE_VERSION = "22"

# Version de test : pas d'indexation par les moteurs de recherche.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

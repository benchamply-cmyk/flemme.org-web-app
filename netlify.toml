# Netlify : projet « flemmeorg » (https://flemme.org), production = branche prod.
# Publie le site apps/web. « publish » et « command » sont relatifs à « base ».
[build]
  base = "apps/web"
  command = "npm run build"
  publish = "dist"
  # Ne reconstruit que si le site ou le code partagé avec l'app mobile (packages/shared) ont changé.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../../packages/shared ../../netlify.toml"

[build.environment]
  NODE_VERSION = "22"
  # Mode réel : VITE_SUPABASE_URL et VITE_SUPABASE_PUBLISHABLE_KEY se règlent dans l'interface Netlify
  # (Environment variables, par contexte de déploiement), pas ici. Sans elles : démo locale.
  # Voir docs/supabase-mise-en-service.md.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Page admin : jamais indexée, jamais mise en cache, jamais affichée dans un cadre.
[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"

# Fonctions Netlify (relatif à « base ») : /api/alerte reçoit les alertes envoyées par Supabase.
[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Anciennes adresses du site historique (dépôt FlemmeV2.0) : on renvoie vers
# le nouvel équivalent plutôt qu'une 404. 302 tant que la refonte n'est pas figée.
[[redirects]]
  from = "/espace*"
  to = "/app.html#mine"
  status = 302

[[redirects]]
  from = "/manager*"
  to = "/app.html#mine"
  status = 302

[[redirects]]
  from = "/rejoindre*"
  to = "/app.html#find"
  status = 302

[[redirects]]
  from = "/gestionadmin*"
  to = "/admin"
  status = 302

[[redirects]]
  from = "/services*"
  to = "/"
  status = 302

[[redirects]]
  from = "/demarche*"
  to = "/"
  status = 302

[[redirects]]
  from = "/ambassadeurs*"
  to = "/"
  status = 302

# Beta is dormant until a branch-specific opt-in; never enable globally.
[context.beta.environment]
  VITE_BETA_ENABLED = "oui"
  VITE_PAIEMENT_EN_LIGNE = "non"

[[headers]]
  for = "/beta*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

name: Tests Version Interne après fusion
on:
  push:
    branches: [preprod, prod]
permissions:
  contents: write
concurrency:
  group: tests-internes-version-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Générer le manifeste
        run: node tests/internes/scripts/version.mjs /tmp/tests-internes-version.json
      - name: Versionner la fusion sans modifier la branche
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          subject=$(git log -1 --format=%s)
          if [[ "$subject" =~ ^Merge\ pull\ request\ \#([0-9]+) ]]; then
            pr="${BASH_REMATCH[1]}"
            short_sha=$(git rev-parse --short=7 HEAD)
            version_tag="tests-internes-${BRANCH_NAME}-pr${pr}-${short_sha}"
            if git rev-parse "$version_tag" >/dev/null 2>&1; then exit 0; fi
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "$version_tag" -m "Version de test ${BRANCH_NAME}, PR #${pr}" "$GITHUB_SHA"
            git push origin "refs/tags/${version_tag}"
          else
            echo 'Aucun tag créé : ce commit ne correspond pas à un merge commit de PR.'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tests-internes-version-${{ github.ref_name }}-${{ github.sha }}
          path: /tmp/tests-internes-version.json
